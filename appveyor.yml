version: 1.0.{build}
image: Visual Studio 2022
max_jobs: 1
clone_depth: 1
skip_tags: true

branches:
  only:
    - main

environment:
  APPVEYOR_CACHE_SKIP_RESTORE: true
  APPVEYOR_CACHE_SKIP_SAVE: true

build_script:
  - ps: |
      & pwsh -NoLogo -NoProfile -File .\runner_canary\appveyor_windows\probe.ps1
      if ($LASTEXITCODE -ne 0) { throw "WS03 AppVeyor Windows canary rejected with exit code $LASTEXITCODE" }

test: off
